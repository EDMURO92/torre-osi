<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torre OSI </title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }
    .game-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: bold;
    }
    canvas {
      width: 100%;
      max-width: 480px;
      height: 400px;
      background: #020617;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      touch-action: none;
    }
    .controls {
      width: 100%;
      display: flex;
      gap: 10px;
    }
    button {
      flex: 1;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: bold;
      color: white;
      background: #0284c7;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
    }
    button:active {
      background: #0369a1;
      transform: translateY(2px);
    }
    .footer {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="game-container">
  <div class="header">
    <div id="layer-info">Capa: 1 (Física)</div>
    <div id="score">Puntos: 0</div>
  </div>

  <canvas id="gameCanvas" width="480" height="400"></canvas>

  <div class="controls">
    <button id="boostBtn">⚡ ACELERAR / BOOST</button>
  </div>

  <div class="footer">
    Desarrollado por <strong>Clan JDT(Edgar Muñoz) y Gabriel Sanabria</strong>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const layerInfo = document.getElementById('layer-info');
  const scoreEl = document.getElementById('score');
  const boostBtn = document.getElementById('boostBtn');

  let score = 0;
  let currentLayer = 1;
  let gameOver = false;

  const player = {
    x: 50,
    y: 200,
    radius: 14,
    speedX: 2.5,
    speedY: 0,
    gravity: 0.2,
    boostPower: -4.5
  };

  let obstacles = [];
  const OSI_LAYERS = [
    "1. Física", "2. Enlace de Datos", "3. Red",
    "4. Transporte", "5. Sesión", "6. Presentación", "7. Aplicación"
  ];

  function initGame() {
    score = 0;
    currentLayer = 1;
    gameOver = false;
    player.x = 50;
    player.y = 200;
    player.speedX = 2.5;
    player.speedY = 0;
    obstacles = [];

    // Generar obstáculos iniciales
    for(let i = 0; i < 5; i++) {
      obstacles.push({
        x: 200 + i * 150,
        y: Math.random() * 300 + 30,
        width: 30,
        height: 60
      });
    }

    updateUI();
  }

  function updateUI() {
    scoreEl.innerText = `Puntos: ${score}`;
    layerInfo.innerText = `Capa: ${OSI_LAYERS[currentLayer - 1]}`;
  }

  function triggerBoost() {
    if (!gameOver) {
      player.speedY = player.boostPower;
      player.speedX = 4; // Acelera temporalmente hacia adelante
    }
  }

  // Controles
  boostBtn.addEventListener('click', triggerBoost);
  canvas.addEventListener('pointerdown', triggerBoost);
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      triggerBoost();
    }
  });

  function update() {
    if (gameOver) return;

    // Física del personaje
    player.speedY += player.gravity;
    player.y += player.speedY;

    // Fricción para normalizar la velocidad hacia adelante
    if (player.speedX > 2.5) player.speedX -= 0.05;
    player.x += player.speedX;

    // Mover la cámara/entorno
    if (player.x > canvas.width / 2) {
      const diff = player.x - canvas.width / 2;
      player.x = canvas.width / 2;
      obstacles.forEach(obs => obs.x -= diff);
      score += Math.floor(diff);
      updateUI();
    }

    // Comprobar avance de capa OSI
    currentLayer = Math.min(7, Math.floor(score / 500) + 1);

    // Reaparición de obstáculos
    obstacles.forEach(obs => {
      if (obs.x + obs.width < 0) {
        obs.x = canvas.width + Math.random() * 100;
        obs.y = Math.random() * (canvas.height - 80);
      }

      // Colisión
      if (
        player.x + player.radius > obs.x &&
        player.x - player.radius < obs.x + obs.width &&
        player.y + player.radius > obs.y &&
        player.y - player.radius < obs.y + obs.height
      ) {
        handleGameOver();
      }
    });

    // Límites de pantalla
    if (player.y - player.radius < 0 || player.y + player.radius > canvas.height) {
      handleGameOver();
    }
  }

  function handleGameOver() {
    gameOver = true;
    // Reinicia automáticamente después de 1.2 segundos
    setTimeout(() => {
      initGame();
    }, 1200);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Dibujar obstáculos
    ctx.fillStyle = '#f43f5e';
    obstacles.forEach(obs => {
      ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
    });

    // Dibujar jugador
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#38bdf8';
    ctx.fill();
    ctx.closePath();

    // Pantalla de Game Over temporal
    if (gameOver) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('¡Reintentando!', canvas.width / 2, canvas.height / 2);
    }
  }

  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  // Iniciar automáticamente
  initGame();
  gameLoop();
</script>

</body>
</html>
